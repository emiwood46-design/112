<style>
/* Layout: one postcard centred on a dark forest ground, command buttons beneath it. Single deliberate theme: printed paper card. */
:root {
  --ground: #232c26;      /* page: forest at dusk */
  --paper: #f6efe1;       /* card border, cream paper */
  --ink: #1f1d1b;         /* text on paper */
  --mist: #c9c2b2;        /* soft text on ground */
  --red: #d4482b;         /* the toy's red, used as accent */
  --amber: #e2a43b;       /* autumn leaf */
  --font-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Caveat", "Comic Sans MS", cursive;
  color-scheme: dark;
}
html, body { background: var(--ground); color: var(--mist); }
body {
  font-family: var(--font-body);
  padding-inline: 16px;
  padding-block: 28px 40px;
  display: flex;
  justify-content: center;
}
.wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 22px; align-items: stretch; }

.card {
  background: var(--paper);
  padding: 14px 14px 0;
  border-radius: 6px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.08) inset;
  transform: rotate(-1deg);
}
.scene { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 2px; background: #eee5d2; }
.scene svg, .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene canvas { pointer-events: none; }
.caption {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 10px 6px 14px;
  color: var(--ink);
  font-family: var(--font-hand);
}
.caption .msg { font-size: clamp(24px, 6vw, 32px); font-weight: 700; line-height: 1.05; }
.caption .count { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.caption .count b { color: var(--red); font-weight: 700; }

.controls { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.hint { font-size: 13px; letter-spacing: .02em; text-align: center; margin: 0; max-width: 46ch; }
.buttons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.buttons button {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(13px, 3.6vw, 16px);
  padding: 14px 8px;
  border-radius: 999px;
  border: 2px solid var(--paper);
  background: transparent;
  color: var(--paper);
  cursor: pointer;
  transition: background .2s, color .2s, transform .15s, opacity .2s;
}
.buttons button:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
.buttons button:active:not(:disabled) { transform: scale(.96); }
.buttons button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.buttons button.on { background: var(--red); border-color: var(--red); color: var(--paper); }
.buttons button:disabled:not(.on) { opacity: .4; cursor: default; }
.buttons kbd { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 500; opacity: .6; margin-top: 3px; }

/* ---------- scene parts ---------- */
#dog, #head, .pose, #arm, #manHead, .bubble, #treat { transition-timing-function: cubic-bezier(.3,1.3,.5,1); }
.pose { opacity: 0; transition: opacity .25s; }
#dog[data-pose="stand"] .pose.stand,
#dog[data-pose="sit"] .pose.sit,
#dog[data-pose="lie"] .pose.lie { opacity: 1; }

#head { transform: translate(205px, 598px); transition: transform .4s; }
#dog[data-pose="sit"] #head { transform: translate(203px, 584px); }
#dog[data-pose="lie"] #head { transform: translate(205px, 668px) rotate(-6deg); }
#dog.bark #head { transform: translate(203px, 594px) rotate(-10deg); }

.mouth-open { opacity: 0; }
#dog.bark .mouth-open { opacity: 1; }
#dog.bark .mouth-closed { opacity: 0; }

.tail { transform-box: fill-box; transform-origin: 90% 90%; animation: wag 1.4s ease-in-out infinite; }
#dog.joy .tail { animation-duration: .22s; }
@keyframes wag { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }

#dogHop { transform-box: view-box; }
#dog.joy #dogHop { animation: hop .5s ease-out 3; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-22px); } 70% { transform: translateY(2px); } }
#dog.pet #dogHop { animation: wiggle .5s ease-in-out 2; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
#dogHop { transform-origin: 200px 740px; }
#dog { cursor: pointer; }

#arm { transform-origin: 400px 215px; transition: transform .25s; }
#man.throw #arm { transform: rotate(62deg); transition-duration: .18s; }
#manHead { transform-origin: 395px 160px; transition: transform .4s; }
#man.look #manHead { transform: rotate(-12deg); }

.bubble { opacity: 0; transform: translateY(8px) scale(.9); transform-box: fill-box; transform-origin: 80% 100%; transition: opacity .2s, transform .3s; }
.bubble.show { opacity: 1; transform: none; }
.bubble text { font-family: var(--font-display); font-weight: 700; }
#dogBubble { transform-origin: 30% 100%; }

#treat { opacity: 0; }
.heart { animation: rise 1.4s ease-out forwards; transform-box: fill-box; transform-origin: center; }
@keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(.4); } 20% { opacity: 1; transform: translateY(-14px) scale(1.1); } 100% { opacity: 0; transform: translateY(-90px) scale(.8); } }

@media (prefers-reduced-motion: reduce) {
  .tail { animation: none; }
  #dog.joy #dogHop, #dog.pet #dogHop { animation: none; }
  .card { transform: none; }
}
</style>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("svg");
  const dog = document.getElementById("dog");
  const man = document.getElementById("man");
  const treat = document.getElementById("treat");
  const hearts = document.getElementById("hearts");
  const manBubble = document.getElementById("manBubble");
  const manText = document.getElementById("manText");
  const dogBubble = document.getElementById("dogBubble");
  const countEl = document.getElementById("count");
  const msgEl = document.getElementById("msg");
  const buttons = [...document.querySelectorAll(".buttons button")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const COMMANDS = {
    sit:   { say: "Сидеть!", pose: "sit",   mouth: [203, 598] },
    lie:   { say: "Лежать!", pose: "lie",   mouth: [205, 682] },
    voice: { say: "Голос!",  pose: "stand", mouth: [203, 612] },
  };
  const PRAISE = ["Умница!", "Хороший мальчик!", "Вот это да!", "Молодец!", "Самый лучший пёс!", "Ням-ням!"];

  let busy = false, count = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function addHearts(x, y, n = 5) {
    for (let i = 0; i < n; i++) {
      const g = document.createElementNS(NS, "g");
      g.setAttribute("transform", `translate(${x + (Math.random() * 70 - 35)} ${y + (Math.random() * 20 - 10)})`);
      const u = document.createElementNS(NS, "use");
      u.setAttribute("href", "#heartShape");
      u.setAttribute("fill", i % 2 ? "#d4482b" : "#e9748a");
      u.setAttribute("class", "heart");
      u.style.animationDelay = (i * 0.12) + "s";
      u.style.opacity = 0;
      g.appendChild(u);
      hearts.appendChild(g);
      setTimeout(() => g.remove(), 1400 + i * 120 + 100);
    }
  }

  function throwTreat(to) {
    // hand position when the arm is swung forward 62° around the shoulder
    const a = 62 * Math.PI / 180, sx = 400, sy = 215, hx = 410 - sx, hy = 450 - sy;
    const from = [sx + hx * Math.cos(a) - hy * Math.sin(a), sy + hx * Math.sin(a) + hy * Math.cos(a)];
    const dur = reduce ? 1 : 720, peak = 140;
    return new Promise(res => {
      treat.style.opacity = 1;
      const t0 = performance.now();
      (function step(now) {
        const t = Math.min(1, (now - t0) / dur);
        const x = from[0] + (to[0] - from[0]) * t;
        const y = from[1] + (to[1] - from[1]) * t - peak * 4 * t * (1 - t);
        treat.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 540})`);
        if (t < 1) requestAnimationFrame(step); else { treat.style.opacity = 0; res(); }
      })(t0);
    });
  }

  async function run(cmd) {
    if (busy) return;
    busy = true;
    const c = COMMANDS[cmd];
    buttons.forEach(b => { b.disabled = true; b.classList.toggle("on", b.dataset.cmd === cmd); });

    manText.textContent = c.say;
    manBubble.classList.add("show");
    man.classList.add("look");
    dog.classList.remove("joy", "bark", "pet");
    await wait(650);

    dog.dataset.pose = c.pose;
    if (cmd === "voice") { dog.classList.add("bark"); dogBubble.classList.add("show"); }
    await wait(700);

    manBubble.classList.remove("show");
    man.classList.add("throw");
    await wait(160);
    const flight = throwTreat(c.mouth);
    await wait(200);
    man.classList.remove("throw");
    await flight;

    dogBubble.classList.remove("show");
    dog.classList.remove("bark");
    dog.classList.add("joy");
    addHearts(c.mouth[0], c.mouth[1] - 50, 6);
    count++;
    countEl.textContent = count;
    msgEl.textContent = PRAISE[(count - 1) % PRAISE.length];
    await wait(1600);

    dog.classList.remove("joy");
    man.classList.remove("look");
    await wait(500);
    dog.dataset.pose = "stand";
    buttons.forEach(b => { b.disabled = false; b.classList.remove("on"); });
    busy = false;
  }

  buttons.forEach(b => b.addEventListener("click", () => run(b.dataset.cmd)));
  addEventListener("keydown", e => {
    const map = { "1": "sit", "2": "lie", "3": "voice" };
    if (map[e.key]) run(map[e.key]);
  });
  dog.addEventListener("click", () => {
    if (busy) return;
    dog.classList.remove("pet"); void dog.getBBox(); dog.classList.add("pet");
    const m = COMMANDS.voice.mouth;
    addHearts(m[0], m[1] - 60, 3);
    setTimeout(() => dog.classList.remove("pet"), 1000);
  });

  // falling leaves
  const cv = document.getElementById("leaves"), ctx = cv.getContext("2d");
  const COLORS = ["#d4482b", "#e2a43b", "#c8783a", "#6f8650"];
  let W = 0, H = 0, leaves = [];
  function size() {
    const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function makeLeaf(y) {
    return { x: Math.random() * W, y: y ?? -20, s: 6 + Math.random() * 8, vy: .35 + Math.random() * .5,
             ph: Math.random() * 6.28, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .03,
             c: COLORS[Math.floor(Math.random() * COLORS.length)] };
  }
  function draw(l) {
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
    ctx.fillStyle = l.c; ctx.beginPath();
    ctx.moveTo(-l.s * 1.4, 0); ctx.lineTo(0, -l.s * .55); ctx.lineTo(l.s * 1.4, 0); ctx.lineTo(0, l.s * .55);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function tick(t) {
    ctx.clearRect(0, 0, W, H);
    for (const l of leaves) {
      l.y += l.vy; l.x += Math.sin(t / 900 + l.ph) * .6; l.rot += l.vr;
      if (l.y > H + 20) Object.assign(l, makeLeaf());
      draw(l);
    }
    requestAnimationFrame(tick);
  }
  size();
  leaves = Array.from({ length: 11 }, () => makeLeaf(Math.random() * H));
  addEventListener("resize", size);
  if (reduce) leaves.forEach(draw); else requestAnimationFrame(tick);
})();
</script>

</body>
